# Railway: build bằng Dockerfile, healthcheck /health.
# App lắng nghe theo biến PORT do Railway cấp (xem CMD trong Dockerfile).
# Đặt biến trên dashboard / CLI, không ghi ở đây:
#   railway variables --set AGENT_API_KEY=... --set REDIS_URL='${{Redis.REDIS_URL}}'

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
